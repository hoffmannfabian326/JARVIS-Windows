name: Diagnose local Windows speech host
on:
  push:
    branches: [diagnostics/windows-speech-1.3]
permissions:
  contents: read
jobs:
  speech:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Unpack exact source
        shell: pwsh
        run: |
          Expand-Archive source-downloads/JARVIS_1.3.0_Neural_Core_Source.zip -DestinationPath build-source
      - name: Compile and probe directly with Windows PowerShell 5.1
        shell: powershell
        working-directory: build-source/JARVIS_1.3.0
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "PowerShell $($PSVersionTable.PSVersion); CLR $([Environment]::Version)"
          Add-Type -AssemblyName System.Speech
          Add-Type -AssemblyName System.Web.Extensions
          Add-Type -Path src-tauri/voice/VoiceHost.cs -ReferencedAssemblies ([System.Speech.Synthesis.SpeechSynthesizer].Assembly.Location),([System.Web.Script.Serialization.JavaScriptSerializer].Assembly.Location),'System.dll','System.Core.dll'
          [JarvisVoice.Host]::Run('{"mode":"probe"}')
      - name: Probe through original launch wrapper
        shell: powershell
        working-directory: build-source/JARVIS_1.3.0
        run: |
          & tests/voice-host-probe.ps1
      - name: Probe with native redirected standard input as used by Rust
        shell: powershell
        working-directory: build-source/JARVIS_1.3.0
        run: |
          $process = New-Object System.Diagnostics.Process
          $process.StartInfo.FileName = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $script = (Resolve-Path src-tauri/voice/launch.ps1).Path
          $source = (Resolve-Path src-tauri/voice/VoiceHost.cs).Path
          $process.StartInfo.Arguments = "-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$script`" -Source `"$source`""
          $process.StartInfo.UseShellExecute = $false
          $process.StartInfo.RedirectStandardInput = $true
          $process.StartInfo.RedirectStandardOutput = $true
          $process.StartInfo.RedirectStandardError = $true
          $process.StartInfo.StandardInputEncoding = New-Object System.Text.UTF8Encoding($false)
          $process.Start() | Out-Null
          $process.StandardInput.WriteLine('{"mode":"probe"}')
          $process.StandardInput.Flush()
          $process.StandardInput.Close()
          $output = $process.StandardOutput.ReadToEnd()
          $process.WaitForExit()
          Write-Output $output
          if (($output | ConvertFrom-Json).type -ne 'capabilities') { throw 'Native pipe speech probe failed' }
