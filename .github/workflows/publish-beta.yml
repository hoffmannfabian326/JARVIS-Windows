name: Publish existing Windows beta installer
on:
  push:
    branches: [release/v1.0.0-beta.1]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify existing installer archive
        run: |
          echo 'd403553f44400971911f3ce92334fcbe48291006cc01949aa258432d4a030f79  release-assets/JARVIS_1.0.0_Windows_x64.zip' | sha256sum --check
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Windows-x64-Beta des J.A.R.V.I.S.-1.0-Prototyps.

          Der Installer ist unsigniert und noch nicht unter Windows getestet.
          Installation, Deinstallation und Hardwaremessungen unter Windows sind unbestätigt.
          Cross-Build und NSIS-Archivprüfung waren erfolgreich.
          Falls WebView2 fehlt, lädt das Setup die Microsoft-Laufzeit nach.

          SHA-256 der ZIP: d403553f44400971911f3ce92334fcbe48291006cc01949aa258432d4a030f79
          NOTES
          gh release create v1.0.0-beta.1 \
            release-assets/JARVIS_1.0.0_Windows_x64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'J.A.R.V.I.S. 1.0 – Windows Beta' \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"
