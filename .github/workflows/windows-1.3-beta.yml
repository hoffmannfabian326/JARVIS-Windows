name: Windows x64 installer 1.3 beta
on:
  push:
    branches: [release/v1.3.0-beta.1]
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: build-source/JARVIS_1.3.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and unpack exact reviewed source
        working-directory: .
        run: |
          $archive = 'source-downloads/JARVIS_1.3.0_Neural_Core_Source.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '2852d78c73ed9bbb0f590bab659382880e4e8670ccc92659e2b51c9915abf0d0') { throw 'Source checksum mismatch' }
          Expand-Archive $archive -DestinationPath build-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare stable Windows MSVC Rust
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
      - name: Install locked frontend dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: React production build
        run: npm run build
      - name: Telemetry regression tests
        run: npm test
      - name: Verify Windows speech host without microphone capture
        run: |
          $output = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/voice-host-probe.ps1
          $capability = $output | Where-Object { $_ -match '^\{' } | Select-Object -Last 1 | ConvertFrom-Json
          if ($null -eq $capability -or $capability.type -ne 'capabilities') { throw 'Local Windows speech host compilation/probe failed' }
          $capability | ConvertTo-Json -Depth 5 -Compress | Set-Content speech-capabilities.json -Encoding utf8NoBOM
          Write-Output "Windows speech host compiled; German voices: $($capability.voices.Count); German recognizer: $($capability.recognition). No microphone was opened."
      - name: Native Windows SQLite provider and RAG tests
        run: cargo test --manifest-path crates/neural-core/Cargo.toml --locked
      - name: Native Windows isolated Credential Manager test
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked credential_roundtrip_replace_and_delete -- --ignored
      - name: Build native x64 NSIS installer
        run: npm run tauri build -- --ci -- --locked
      - name: Verify installer payload and prepare delivery
        run: |
          New-Item -ItemType Directory -Force release-output | Out-Null
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $setup = Join-Path (Get-Location) 'release-output/JARVIS_1.3.0_Windows_x64_Setup.exe'
          Copy-Item $installers[0].FullName $setup
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw '7-Zip verification tool unavailable' }
          & $sevenZip t $setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extract = Join-Path $env:RUNNER_TEMP 'jarvis-installer-payload'
          & $sevenZip x '-y' "-o$extract" $setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('VoiceHost.cs','launch.ps1')) {
            $payload = @(Get-ChildItem $extract -Recurse -File | Where-Object Name -eq $name)
            if ($payload.Count -ne 1) { throw "Voice resource missing: $name" }
            if ((Get-FileHash $payload[0].FullName).Hash -ne (Get-FileHash "src-tauri/voice/$name").Hash) { throw "Voice resource mismatch: $name" }
          }
          $binary = @(Get-ChildItem $extract -Recurse -Filter 'jarvis-command-center.exe')
          if ($binary.Count -ne 1) { throw 'Application binary missing' }
          $bytes = [IO.File]::ReadAllBytes($binary[0].FullName)
          $pe = [BitConverter]::ToInt32($bytes,0x3c)
          if ([BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x8664) { throw 'Application is not Windows x64' }
          Compress-Archive -Path $setup -DestinationPath release-output/JARVIS_1.3.0_Windows_x64.zip
          Copy-Item ../../source-downloads/JARVIS_1.3.0_Neural_Core_Source.zip release-output/
          $hashes = Get-ChildItem release-output -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $hashes | Set-Content release-output/SHA256SUMS.txt -Encoding utf8NoBOM
          $speech = Get-Content speech-capabilities.json | ConvertFrom-Json
          @"
          # J.A.R.V.I.S. 1.3 – Windows Beta

          Nativer Windows-x64-MSVC-Release-Build mit NSIS-Installer.
          Geprüft: TypeScript, React-Build, sechs Telemetrietests, 15 Core-Tests mit SQLite/RAG/HTTP-Testserver, isolierter Credential-Manager-Roundtrip, Windows-System.Speech-Host-Kompilierung und Fähigkeitenprobe mit roher UTF-8-Eingabe ohne Mikrofonaufnahme.
          Sprachprobe auf dem CI-Runner: $($speech.voices.Count) deutsche Stimmen, deutscher Erkenner: $($speech.recognition). Kein Audio-/Mikrofontest.
          Zusätzlich: NSIS-Archiv entpackt/geprüft, x64-Anwendungsdatei und bytegleiche Voice-Ressourcen bestätigt.

          Der Installer ist unsigniert. Installation/Deinstallation, tatsächliche Hardwaremessung, Mikrofonaufnahme, deutsche Stimmen und reale OpenAI-/Groq-Konten wurden nicht getestet.
          Kein stabiler Produktivfreigabenachweis. Microsoft WebView2 und die in README_DE.md genannten Sprachvoraussetzungen gelten.
          API-Schlüssel werden nicht mitgeliefert; sie sind nach Installation ausdrücklich im Windows Credential Manager einzurichten.

          Source SHA-256: 2852d78c73ed9bbb0f590bab659382880e4e8670ccc92659e2b51c9915abf0d0
          Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@ | Set-Content release-output/BUILD_REPORT.md -Encoding utf8NoBOM
      - name: Upload Windows beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release-output -File | ForEach-Object FullName)
          gh release create v1.3.0-beta.1 @assets --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'J.A.R.V.I.S. 1.3 – Neural Intelligence Core · Windows Beta' --prerelease --notes-file release-output/BUILD_REPORT.md
