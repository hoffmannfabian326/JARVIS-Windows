name: Prüfungen

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typen und Client bauen
        run: npm run build

      - name: Selbsttests
        run: npm test
