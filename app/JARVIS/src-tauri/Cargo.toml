[package]
name = "jarvis-command-center"
version = "1.4.2"
description = "J.A.R.V.I.S. Windows Command Center"
authors = ["J.A.R.V.I.S. Project"]
edition = "2021"

[lib]
name = "jarvis_command_center_lib"
# Windows desktop target; mobile DLL/static-library outputs are not needed.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

jarvis-neural-core = { path = "../crates/neural-core" }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
